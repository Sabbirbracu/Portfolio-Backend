# STEP 1 (HTTP only, for cert issuance). Added alongside default.conf.template. Does not modify any existing server block.
# Plain nginx (no envsubst variables needed, but $vars are preserved by the image's envsubst).

server {
    listen 80;
    server_name api.bysabbir.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

